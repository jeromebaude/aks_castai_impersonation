name: Documentation Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # Pinned so the generated block matches what is committed in README.md.
  TERRAFORM_DOCS_VERSION: v0.24.0

jobs:
  check_readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo install -m 755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      - name: Generate documentation
        run: make generate-doc

      - name: Check for uncommitted changes
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::README.md is not up-to-date. Run 'make generate-doc' locally and commit the changes."
            echo ""
            echo "Changes needed:"
            git diff
            exit 1
          fi
          echo "README.md is up-to-date!"
